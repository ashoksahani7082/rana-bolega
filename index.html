    <script>
        // Simple countdown timer logic
        document.addEventListener('DOMContentLoaded', () => {
            let totalSeconds = 55; // Starting at 55 seconds as per screenshot
            const minEl = document.getElementById('min');
            const secEl = document.getElementById('sec');

            const updateTimer = () => {
                if (totalSeconds <= 0) {
                    // Optional: Reset timer or keep at 0
                    totalSeconds = 60 * 5; // Reset to 5 mins for demo
                }
                
                const m = Math.floor(totalSeconds / 60);
                const s = totalSeconds % 60;
                
                minEl.textContent = m.toString().padStart(2, '0');
                secEl.textContent = s.toString().padStart(2, '0');
                
                totalSeconds--;
            };

            setInterval(updateTimer, 1000);
        });
    </script>
